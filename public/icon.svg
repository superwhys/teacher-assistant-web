<!-- 教师工具合集 Icon — 黑板 + 铅笔 + 齿轮 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="教师工具合集图标">
  <!-- 背景圆角方块（黑板础） -->
  <rect x="2" y="6" width="60" height="46" rx="6" ry="6" fill="#0f4c81"/>

  <!-- 黑板上的线（模拟粉笔划线） -->
  <g fill="#cfe8ff" opacity="0.95">
    <rect x="8" y="14" width="40" height="2" rx="1"/>
    <rect x="8" y="19" width="32" height="2" rx="1"/>
    <rect x="8" y="24" width="28" height="2" rx="1"/>
  </g>

  <!-- 铅笔（右下） -->
  <g transform="translate(36,30) rotate(20)">
    <!-- 铅笔主体 -->
    <rect x="-10" y="6" width="24" height="6" rx="1.2" fill="#ffd166"/>
    <!-- 铅笔金属件 -->
    <rect x="-12" y="6" width="2" height="6" fill="#c2c2c2"/>
    <rect x="12" y="6" width="2" height="6" fill="#c2c2c2"/>
    <!-- 铅笔尖（木） -->
    <polygon points="14,9 18,10 14,13" fill="#f4a261"/>
    <!-- 铅笔笔尖（石墨） -->
    <polygon points="18,10 20,11 18,12" fill="#2b2b2b"/>
    <!-- 阴影 -->
    <rect x="-10" y="12" width="24" height="1.5" rx="0.8" fill="#e0b36a" opacity="0.45"/>
  </g>

  <!-- 小齿轮（左下，代表工具） -->
  <g transform="translate(12,36)">
    <circle cx="0" cy="0" r="6.2" fill="#ffefc2"/>
    <circle cx="0" cy="0" r="3.1" fill="#0f4c81"/>
    <!-- 齿 -->
    <g fill="#ffefc2" transform="translate(0,0)">
      <rect x="-1" y="-9.2" width="2" height="3.8" rx="0.6"/>
      <rect x="-1" y="5.4" width="2" height="3.8" rx="0.6" transform="rotate(180)"/>
      <rect x="-9.2" y="-1" width="3.8" height="2" rx="0.6" transform="rotate(-90)"/>
      <rect x="5.4" y="-1" width="3.8" height="2" rx="0.6" transform="rotate(90)"/>
      <rect x="-6.5" y="-6.5" width="3.6" height="2" rx="0.5" transform="rotate(-45)"/>
      <rect x="3.0" y="3.0" width="3.6" height="2" rx="0.5" transform="rotate(-45)"/>
      <rect x="-6.5" y="3.0" width="3.6" height="2" rx="0.5" transform="rotate(45)"/>
      <rect x="3.0" y="-6.5" width="3.6" height="2" rx="0.5" transform="rotate(45)"/>
    </g>
  </g>

  <!-- 底部支架（像黑板腿） -->
  <g fill="#083b61" opacity="0.95">
    <rect x="8" y="50" width="12" height="4" rx="1.2"/>
    <rect x="44" y="50" width="12" height="4" rx="1.2"/>
  </g>
</svg>
